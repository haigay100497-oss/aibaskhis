<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Trợ lý AI</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 85vh;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background: #2563eb;
            color: white;
            padding: 16px 20px;
            font-size: 18px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .status-dot {
            width: 10px;
            height: 10px;
            background-color: #4ade80;
            border-radius: 50%;
        }
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 14px;
            line-height: 1.5;
            font-size: 15px;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-message {
            background-color: #f1f5f9;
            color: #1e293b;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #e2e8f0;
            background: #ffffff;
            gap: 8px;
        }
        input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #cbd5e1;
            border-radius: 24px;
            outline: none;
            font-size: 15px;
        }
        input:focus {
            border-color: #2563eb;
        }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 24px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="status-dot"></div>
        <span>Trợ lý AI</span>
    </div>
    
    <div class="chat-box" id="chat-box">
        <div class="message ai-message">Xin chào! Tôi là trợ lý AI. Tôi có thể giúp gì cho bạn hôm nay?</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Nhập tin nhắn của bạn..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }

    function sendMessage() {
        const text = userInput.value.trim();
        if (text === '') return;

        // Hiển thị tin nhắn người dùng
        appendMessage(text, 'user-message');
        userInput.value = '';

        // Hiển thị trạng thái AI đang suy nghĩ
        const typingId = 'typing-' + Date.now();
        appendMessage('Đang suy nghĩ...', 'ai-message', typingId);

        // Mô phỏng phản hồi từ AI (Bạn có thể thay phần này bằng lệnh fetch() gọi API thật)
        setTimeout(() => {
            const typingElement = document.getElementById(typingId);
            if (typingElement) {
                typingElement.textContent = generateMockResponse(text);
            }
            chatBox.scrollTop = chatBox.scrollHeight;
        }, 800);
    }

    function appendMessage(text, className, id = null) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${className}`;
        msgDiv.textContent = text;
        if (id) msgDiv.id = id;
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function generateMockResponse(input) {
        const lower = input.toLowerCase();
        if (lower.includes('xin chào') || lower.includes('chào')) {
            return 'Chào bạn! Rất vui được hỗ trợ bạn.';
        } else if (lower.includes('bạn là ai')) {
            return 'Tôi là giao diện mẫu của một trợ lý ảo AI được viết bằng HTML, CSS và JavaScript.';
        } else {
            return `Bạn vừa nhắn: "${input}". Để tôi trả lời thông minh hơn, hãy kết nối tôi với một AI API nhé!`;
        }
    }
</script>

</body>
</html>
